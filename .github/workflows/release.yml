name: Build installer

# Push a tag like v1.0.0 (or run this workflow by hand) and GitHub builds the Windows installer in the cloud.
# Tag pushes also publish it as a GitHub Release that anyone can download.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build the app
        shell: pwsh
        run: ./build_portable.ps1

      - name: Smoke-test the built app
        shell: pwsh
        run: ./scripts/smoke_test_exe.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\EDAStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem release | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB)}}

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EDAStudio-Setup
          path: release/EDAStudio-Setup-*.exe
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem release\EDAStudio-Setup-*.exe).FullName `
            --title "EDA Studio $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes-file .github/release-notes.md
